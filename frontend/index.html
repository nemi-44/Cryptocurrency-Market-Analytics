<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Crypto Trend & Spike Analytics</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #17202a;
        background: #f6f7f9;
      }

      body {
        margin: 0;
      }

      header {
        background: #101820;
        color: #ffffff;
        padding: 24px clamp(16px, 4vw, 48px);
      }

      h1 {
        margin: 0 0 8px;
        font-size: clamp(24px, 4vw, 38px);
        font-weight: 720;
        letter-spacing: 0;
      }

      .subtitle {
        margin: 0;
        color: #d8e2ea;
        max-width: 760px;
      }

      main {
        padding: 24px clamp(16px, 4vw, 48px) 48px;
      }

      .metrics {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
        gap: 12px;
        margin-bottom: 24px;
      }

      .metric {
        background: #ffffff;
        border: 1px solid #dde3ea;
        border-radius: 8px;
        padding: 14px 16px;
      }

      .metric span {
        display: block;
        color: #5f6f7b;
        font-size: 13px;
      }

      .metric strong {
        display: block;
        margin-top: 6px;
        font-size: 22px;
      }

      .tables {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 520px), 1fr));
        gap: 18px;
      }

      section {
        min-width: 0;
      }

      h2 {
        margin: 0 0 10px;
        font-size: 18px;
      }

      .table-wrap {
        overflow-x: auto;
        border: 1px solid #dde3ea;
        border-radius: 8px;
        background: #ffffff;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        min-width: 660px;
      }

      th,
      td {
        padding: 11px 12px;
        border-bottom: 1px solid #edf1f5;
        text-align: right;
        white-space: nowrap;
        font-size: 14px;
      }

      th:first-child,
      td:first-child {
        text-align: left;
      }

      th {
        background: #f9fafb;
        color: #43525d;
        font-size: 12px;
        text-transform: uppercase;
      }

      tr:last-child td {
        border-bottom: 0;
      }

      .status {
        margin: 0 0 16px;
        color: #43525d;
      }

      .empty {
        padding: 18px;
        color: #6b7b86;
      }

      .positive {
        color: #047857;
        font-weight: 650;
      }

      .negative {
        color: #b42318;
        font-weight: 650;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Crypto Trend & Spike Analytics</h1>
      <p class="subtitle">Live five-minute USDT spot market ranking from the AWS serving layer.</p>
    </header>

    <main>
      <p id="status" class="status">Loading latest market window...</p>
      <div class="metrics">
        <div class="metric"><span>Latest Window</span><strong id="latestWindow">-</strong></div>
        <div class="metric"><span>Trending Rows</span><strong id="trendCount">0</strong></div>
        <div class="metric"><span>Spike Rows</span><strong id="spikeCount">0</strong></div>
        <div class="metric"><span>Refresh</span><strong>10s</strong></div>
      </div>

      <div class="tables">
        <section>
          <h2>Trending Now</h2>
          <div class="table-wrap" id="trendingTable"></div>
        </section>
        <section>
          <h2>Abnormal Price Spikes</h2>
          <div class="table-wrap" id="spikeTable"></div>
        </section>
      </div>
    </main>

    <script>
      const API_URL = "API_URL_PLACEHOLDER";
      const columns = [
        ["symbol", "Symbol"],
        ["price", "Price"],
        ["return_5m_pct", "5m Return %"],
        ["quote_volume_5m", "5m Quote Vol"],
        ["trend_score", "Trend Score"],
        ["spike_zscore", "Spike Z"],
        ["latency_ms", "Latency ms"]
      ];

      function formatValue(key, value) {
        if (value === undefined || value === null || value === "") return "-";
        if (key === "symbol") return value;
        const number = Number(value);
        if (Number.isNaN(number)) return value;
        if (key === "latency_ms") return Math.round(number).toLocaleString();
        if (key.includes("pct") || key.includes("score") || key.includes("zscore")) return number.toFixed(3);
        return number.toLocaleString(undefined, { maximumFractionDigits: 2 });
      }

      function renderTable(targetId, rows) {
        const target = document.getElementById(targetId);
        if (!rows.length) {
          target.innerHTML = '<div class="empty">No rows for the latest window yet.</div>';
          return;
        }
        const head = columns.map(([, label]) => `<th>${label}</th>`).join("");
        const body = rows.map((row) => {
          const cells = columns.map(([key]) => {
            const value = formatValue(key, row[key]);
            const className = key === "return_5m_pct" && Number(row[key]) < 0 ? "negative" : key === "return_5m_pct" ? "positive" : "";
            return `<td class="${className}">${value}</td>`;
          }).join("");
          return `<tr>${cells}</tr>`;
        }).join("");
        target.innerHTML = `<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;
      }

      async function loadLatest() {
        const status = document.getElementById("status");
        if (!API_URL || API_URL === "API_URL_PLACEHOLDER") {
          status.textContent = "Set the API Gateway URL in frontend/index.html before uploading to S3.";
          return;
        }
        try {
          const response = await fetch(API_URL, { cache: "no-store" });
          if (!response.ok) throw new Error(`API returned ${response.status}`);
          const payload = await response.json();
          const trending = payload.trending || [];
          const spikes = payload.spikes || [];
          document.getElementById("latestWindow").textContent = payload.latest_window || "-";
          document.getElementById("trendCount").textContent = trending.length;
          document.getElementById("spikeCount").textContent = spikes.length;
          renderTable("trendingTable", trending);
          renderTable("spikeTable", spikes);
          status.textContent = `Updated ${new Date().toLocaleTimeString()}`;
        } catch (error) {
          status.textContent = `Unable to load API data: ${error.message}`;
        }
      }

      loadLatest();
      setInterval(loadLatest, 10000);
    </script>
  </body>
</html>
